<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator_TALA</title>
    <link rel="stylesheet" href="calculator_TALA.css">
</head>
<body>

    <div class="add"> </div>

    <div id="calc">

        <div id="dis"></div>

        <div class="row">
            <button class="op">clear</button>
            <button class="op">(</button>
            <button class="op">)</button>
            <button class="op">*</button>
        </div>

        <div class="row">
            <button>9</button>
            <button>8</button>
            <button>7</button>
            <button class="op">+</button>
        </div>

        <div class="row">
            <button>6</button>
            <button>5</button>
            <button>4</button>
            <button class="op">-</button>
        </div>

        <div class="row">
            <button>3</button>
            <button>2</button>
            <button>1</button>
            <button class="op">/</button>
        </div>

        <div class="row">
            <button>0</button>
            <button>.</button>
            <button>d</button>
            <button class="equal">=</button>
        </div>


        </div>
   

    
    <div class="circle-small c1"></div>
    <div class="circle-small c2"></div>
    <div class="circle-small c3"></div>

    <div class="float-btn f1"><div>6</div></div>
    <div class="float-btn f2"><div>6</div></div>
    <div class="mini-calc">
    <div class="mini-btn zero">0</div>
    <div class="mini-btn one">1</div>
    <div class="mini-btn two">2</div>
    <div class="mini-btn three">3</div>
    <div class="mini-op plus">+</div>
    <div class="mini-btn dot">.</div>
    <div class="mini-equal">=</div>

</div>



    

    <script src="./calculator_TALA.js"></script>
</body>
</html>
